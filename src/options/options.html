<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>社交评论清理器</title><link rel="stylesheet" href="./options.css" /></head><body><main class="page"><header class="header"><div class="brand"><img class="brand-icon" src="../../assets/icons/icon-48.png" width="48" height="48" alt="" /><div><h1>社交评论清理器</h1><span class="version">版本 1.0.0</span></div></div><p>仅在已登录的 Instagram 当前页面操作；请先使用测试账号和预览模式确认规则。</p></header><form id="settingsForm" class="form">
<label class="field"><span>目标帖子 URL</span><input id="targetPostUrl" type="url" placeholder="https://www.instagram.com/p/shortcode/" required /></label><label class="field"><span>白名单用户名</span><textarea id="whitelist" rows="6" placeholder="每行一个用户名，可带 @"></textarea></label><label class="field"><span>删除关键词</span><textarea id="deleteKeywords" rows="6" placeholder="每行一个普通文本关键词；留空时只预览，不删除"></textarea></label>
<fieldset><legend>操作节奏</legend><p class="hint">系统会在设定时间附近等待，不会每次完全一样。</p><div class="grid three"><label>每次操作大约等待多久（秒）<input id="operationMean" type="number" min="1" /></label><label>最短等待时间（秒）<input id="operationMin" type="number" min="1" /></label><label>最长等待时间（秒）<input id="operationMax" type="number" min="1" /></label><label>删除前等待大约多久（秒）<input id="deleteDialogMean" type="number" min="1" /></label><label>删除前等待最短时间（秒）<input id="deleteDialogMin" type="number" min="1" /></label><label>删除前等待最长时间（秒）<input id="deleteDialogMax" type="number" min="1" /></label><label>连续处理多少条后休息<input id="maxConsecutive" type="number" min="1" /></label><label>每次休息大约多久（秒）<input id="restMean" type="number" min="1" /></label><label>休息最短时间（秒）<input id="restMin" type="number" min="1" /></label><label>休息最长时间（秒）<input id="restMax" type="number" min="1" /></label></div></fieldset>
<fieldset><legend>本轮完成后的自动续跑</legend><p class="hint">当前评论全部处理完成后才会进入休息态；休息结束后绕过页面缓存刷新并继续执行。休息时间必须在 10～60 分钟内。</p><div class="grid three"><label>平均等待时间（分钟）<input id="refreshMean" type="number" min="10" max="60" /></label><label>最短等待时间（分钟）<input id="refreshMin" type="number" min="10" max="60" /></label><label>最长等待时间（分钟）<input id="refreshMax" type="number" min="10" max="60" /></label></div></fieldset>
<fieldset><legend>本次任务限制</legend><div class="grid"><label>本次最多删除多少条评论<select id="sessionLimit"><option value="unlimited">不限（由限频控制）</option><option value="30">30 条</option><option value="100">100 条</option><option value="300">300 条</option></select></label><label>本次最多运行多久（分钟，0 表示不限）<input id="sessionMaxMinutes" type="number" min="0" /></label></div><p class="hint">正式运行会持续多个轮次；只有点击暂停、停止或发生安全异常才会结束。预览模式只扫描不删除，也不会长期自动刷新。</p></fieldset>
<details class="advanced"><summary>高级设置 <span id="advancedSummary"></span></summary><div class="details-content"><h2>操作次数上限</h2><div class="grid"><label>1 分钟内最多操作多少次<input id="perMinute" type="number" min="1" /></label><label>1 小时内最多操作多少次<input id="perHour" type="number" min="1" /></label></div><p class="hint">所有打开的 Instagram 标签页共用此上限；页面异常时任务会直接暂停。</p></div></details>
<span id="status" class="status" aria-live="polite"></span><div class="actions"><button type="submit">开始</button><button type="button" id="pauseButton" class="pause">暂停</button><button type="button" id="stopButton" class="stop">停止</button><button type="button" id="previewButton" class="preview">预览模式</button></div></form></main><script src="../shared/action-pace-config.js"></script><script src="../content/rules.js"></script><script src="./options.js"></script></body></html>
